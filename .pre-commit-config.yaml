repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  # Lokale hooks gebruiken de vastgezette versies uit uv.lock en pnpm-lock.yaml,
  # dus precies dezelfde ruff/mypy/eslint als CI.
  - repo: local
    hooks:
      - id: backend-ruff
        name: backend ruff (lint + format)
        entry: bash -c 'cd backend && uv run ruff check --fix . && uv run ruff format .'
        language: system
        files: ^backend/
        pass_filenames: false
      - id: backend-mypy
        name: backend mypy
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        files: ^backend/
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint + format
        entry: bash -c 'cd frontend && pnpm lint && pnpm exec prettier --check .'
        language: system
        files: ^frontend/
        pass_filenames: false
