# Dev-override: hot reload voor de api, poorten open voor lokale tools (alleen op
# 127.0.0.1: Redis heeft geen wachtwoord).
#   make dev   (of: docker compose -f docker/compose/docker-compose.yml \
#                     -f docker/compose/docker-compose.dev.yml --env-file .env up --build)
# De frontend draai je lokaal met `cd frontend && pnpm dev` (proxy naar :8000).
services:
  api:
    environment:
      ENVIRONMENT: development
      LOG_JSON: "false"
    command: ["uvicorn", "cssthema.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src", "--no-access-log"]
    volumes:
      - ../../backend/src:/app/src:ro
      - ../../backend/migrations:/app/migrations:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks: [internal, edge]

  worker:
    environment:
      ENVIRONMENT: development
      LOG_JSON: "false"
    volumes:
      - ../../backend/src:/app/src:ro

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    networks: [internal, edge]

  redis:
    ports:
      - "127.0.0.1:6379:6379"
    networks: [internal, edge]
