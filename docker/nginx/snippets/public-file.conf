# Bestanden uit /var/lib/cssthema/css-files die apps cross-origin laden (via sub_filter):
# zelfde CORS-header als de CSS die de api levert, zodat ook <link crossorigin>,
# @font-face en het uitlezen van de stylesheet (CSSOM) vanaf een ander domein werken.
add_header Access-Control-Allow-Origin "*" always;
add_header Cache-Control "no-cache" always;
