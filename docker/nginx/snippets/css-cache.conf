# Gedeeld door de publieke server en de interne refresh-server (zie spike S3,
# docs/spikes/s3-css-cache.md). De sleutel is alleen het pad: `?v=` en Host
# tellen niet mee, zodat de refresh-server dezelfde entry overschrijft.
proxy_cache            css;
proxy_cache_key        $uri;
proxy_cache_valid      200 301 60s;
proxy_cache_valid      404 10s;
proxy_cache_lock       on;
proxy_cache_revalidate on;
proxy_cache_background_update on;
proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
# Publieke CSS kent geen cookies: niets meesturen, en een Set-Cookie van de api
# nooit cachen of doorgeven aan clients.
proxy_ignore_headers   Set-Cookie;
proxy_hide_header      Set-Cookie;
proxy_set_header       Cookie "";
add_header X-Cache-Status $upstream_cache_status always;
