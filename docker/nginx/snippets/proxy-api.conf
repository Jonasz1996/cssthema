proxy_http_version 1.1;
proxy_set_header Host              $host;
# real_ip heeft de echte client al bepaald; stuur alleen die door, zodat de api
# (uvicorn --proxy-headers) geen door de client verzonnen XFF-waarde overneemt.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Request-ID      $ct_request_id;
proxy_set_header Connection        "";
