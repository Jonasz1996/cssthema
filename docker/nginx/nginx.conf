worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,"cache":"$upstream_cache_status",'
        '"request_id":"$ct_request_id","ua":"$http_user_agent"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # NPM zet X-Forwarded-For. Welke bronnen we daarin vertrouwen, komt uit
    # TRUSTED_PROXIES (zie docker/nginx/entrypoint/40-cssthema-real-ip.sh): de
    # set_real_ip_from-regels staan in conf.d/00-real-ip.conf.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker-DNS, zodat nginx `api` opnieuw opzoekt als die container een nieuw IP krijgt.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Request-ID van de client overnemen als die geldig is (zelfde regel als de api),
    # anders een eigen ID. nginx-log en api-log tonen zo dezelfde waarde.
    map $http_x_request_id $ct_request_id {
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
        default                   $request_id;
    }

    include /etc/nginx/conf.d/*.conf;
}
