# Gedeeld door de Docker-image en de installatie zonder Docker (deploy/debian/install.sh).

# NPM zet X-Forwarded-For. Welke bronnen we daarin vertrouwen, komt uit
# TRUSTED_PROXIES (zie docker/nginx/entrypoint/40-cssthema-real-ip.sh): de
# set_real_ip_from-regels en de geo voor $ct_trusted_peer staan in conf.d/00-real-ip.conf.
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Schrijven op /api/ (POST, PUT, PATCH, DELETE) alleen via de reverse proxy of vanaf deze
# machine zelf ($ct_trusted_peer). Fase 1 heeft geen login: Authentik in NPM is de enige
# bescherming, en wie poort 80 rechtstreeks bereikt (het LAN, een andere container) zou die
# omzeilen en bv. een script kunnen zetten dat daarna in elke app draait. Lezen mag wel.
map $request_method $ct_api_write {
    GET     0;
    HEAD    0;
    OPTIONS 0;
    default 1;
}
map "$ct_api_write:$ct_trusted_peer" $ct_api_write_denied {
    "1:0"   1;
    default 0;
}

# Request-ID van de client overnemen als die geldig is (zelfde regel als de api),
# anders een eigen ID. nginx-log en api-log tonen zo dezelfde waarde.
map $http_x_request_id $ct_request_id {
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
    default                   $request_id;
}

upstream cssthema_api {
    # `resolve` (nginx >= 1.27.3) volgt een nieuw IP van de api via de resolver in nginx.conf.
    zone cssthema_api 64k;
    server api:8000 resolve;
    keepalive 32;
}

# CSS-microcache: 60 s vers, tot 24 u als stale bij backend-uitval.
proxy_cache_path /var/cache/nginx/css levels=1:2 keys_zone=css:10m max_size=256m
                 inactive=24h use_temp_path=off;

# Load-tests (k6, docs/07 fase 1) draaien in de nginx-container zelf (127.0.0.1) en
# vallen buiten de limiet; een lege sleutel telt niet mee.
geo $public_css_limit_exempt {
    default   0;
    127.0.0.1 1;
}
map $public_css_limit_exempt $public_css_limit_key {
    1       "";
    default $binary_remote_addr;
}

limit_req_zone $public_css_limit_key zone=public_css:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=css_refresh:1m rate=10r/s;
limit_req_status 429;

# Publieke server (achter Nginx Proxy Manager).
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    # Ook in de installatie zonder Docker, waar Debians nginx.conf gzip alleen voor text/html
    # aanzet: de SPA-bundels (Monaco ~4 MB, CSS-worker ~1 MB) en de publieke CSS gecomprimeerd.
    # (Zelfde waarden als docker/nginx/nginx.conf; op serverniveau, dus geen dubbele directive.)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Publieke thema-CSS: /{slug}.css, /themes/{slug}.css, /themes/{slug}@{n}.css
    # Staat er een bestand met die naam in /var/lib/cssthema/css-files, dan gaat dat
    # voor: zo blijven handgemaakte CSS-bestanden werken tot ze in cssthema
    # geïmporteerd zijn (fase 1). Anders levert de api de gepubliceerde versie.
    location ~ "^/(?:themes/)?[a-z0-9][a-z0-9-]{0,62}[a-z0-9](?:@[0-9]+)?\.css$" {
        limit_req zone=public_css burst=100 nodelay;
        root /var/lib/cssthema/css-files;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/public-file.conf;
        try_files $uri @cssthema_css;
    }

    # Thema-scripts (bv. algemeen.js met de netwerkachtergrond) staan als bestand in
    # /var/lib/cssthema/css-files (met de hand of via het dashboard, /api/v1/scripts) en
    # worden net als de CSS met sub_filter in apps geladen. Alleen een platte naam in de
    # root; de eigen scripts van het dashboard staan in /assets/ en /preview-bridge.js
    # (exacte location hieronder, gaat voor; de api weigert die naam).
    location ~ "^/[a-z0-9][a-z0-9-]{0,62}[a-z0-9]\.js$" {
        limit_req zone=public_css burst=100 nodelay;
        root /var/lib/cssthema/css-files;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/public-file.conf;
        try_files $uri =404;
    }

    # Lettertypes naast de thema's (voor @font-face in een thema), ook cross-origin.
    location ~ "^/[A-Za-z0-9][A-Za-z0-9._-]{0,127}\.(?:woff2?|ttf|otf)$" {
        limit_req zone=public_css burst=100 nodelay;
        root /var/lib/cssthema/css-files;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/public-file.conf;
        try_files $uri =404;
    }

    location = /preview-bridge.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location @cssthema_css {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/css-cache.conf;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_pass http://cssthema_api;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        # Fouten van nginx zelf als Problem Details, zoals die van de api (proxied responses
        # houden hun eigen Content-Type).
        default_type application/problem+json;
        if ($ct_api_write_denied) {
            return 403 '{"type":"https://cssthema.dev/problems/proxy-required","title":"Schrijven kan alleen via de reverse proxy","status":403,"code":"proxy_required","detail":"cssthema aanvaardt wijzigingen alleen via Nginx Proxy Manager (TRUSTED_PROXIES) of vanaf de server zelf. Open het dashboard via je domein, of zet het IP van je proxy in TRUSTED_PROXIES.","request_id":"$ct_request_id"}\n';
        }
        include /etc/nginx/snippets/proxy-api.conf;
        # SSE (job-events) niet bufferen.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://cssthema_api;
    }

    location ~ ^/(healthz|readyz)$ {
        access_log off;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://cssthema_api;
    }

    # Metrics zijn alleen intern bereikbaar (scrape rechtstreeks op api:8000).
    location = /metrics {
        return 404;
    }

    # Verborgen paden onder css-files zijn nooit publiek: na een import staan de
    # oorspronkelijke bestanden in css-files/.geimporteerd/, vervangen en verwijderde
    # scripts in css-files/.scripts-archief/. Moet vóór `\.css$` staan.
    location ~ "/\..*\.css$" {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/css;
        add_header Cache-Control "public, max-age=10" always;
        return 404 "/* cssthema: not found */\n";
    }

    location ~ "/\..*\.js$" {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/javascript;
        add_header Cache-Control "public, max-age=10" always;
        return 404 "/* cssthema: not found */\n";
    }

    # Elke andere .css-URL (geen geldige slug) komt alleen uit
    # /var/lib/cssthema/css-files, anders een 404, nooit de SPA.
    location ~ \.css$ {
        root /var/lib/cssthema/css-files;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/public-file.conf;
        try_files $uri @css_not_found;
    }

    # Idem voor .js: een naam met hoofdletters of een submap is nooit de SPA (200 text/html).
    location ~ \.js$ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/javascript;
        add_header Cache-Control "public, max-age=10" always;
        return 404 "/* cssthema: not found */\n";
    }

    location @css_not_found {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/css;
        add_header Cache-Control "public, max-age=10" always;
        return 404 "/* cssthema: not found */\n";
    }

    # Gehashte build-assets: lang cachen.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: alle andere routes naar index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

# Interne refresh-server: de api roept na elke wijziging van publieke CSS
#   GET http://nginx:8081/{slug}.css  (en /themes/{slug}.css)
# aan. Dat haalt de CSS altijd vers op en overschrijft de cache-entry.
# De poort is niet gepubliceerd, maar wel bereikbaar voor elke container op `edge`
# en `internal` (ook NPM als `edge` aan het NPM-netwerk hangt). Daarom een eigen,
# krappe rate limit: de api zelf doet maar een paar calls per publicatie.
server {
    listen 8081;
    server_name _;
    access_log off;

    location ~ "^/(?:themes/)?[a-z0-9][a-z0-9-]{0,62}[a-z0-9](?:@[0-9]+)?\.css$" {
        limit_req zone=css_refresh burst=20 nodelay;
        include /etc/nginx/snippets/css-cache.conf;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_cache_bypass 1;
        proxy_pass http://cssthema_api;
    }

    location / {
        return 404;
    }
}
