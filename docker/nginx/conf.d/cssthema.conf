upstream cssthema_api {
    server api:8000;
    keepalive 32;
}

# CSS-microcache: 60 s vers, tot 24 u als stale bij backend-uitval.
proxy_cache_path /var/cache/nginx/css levels=1:2 keys_zone=css:10m max_size=256m
                 inactive=24h use_temp_path=off;

limit_req_zone $binary_remote_addr zone=public_css:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

# Publieke server (achter Nginx Proxy Manager).
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    include /etc/nginx/snippets/security-headers.conf;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Publieke thema-CSS: /{slug}.css, /themes/{slug}.css, /themes/{slug}@{n}.css
    location ~ "^/(?:themes/)?[a-z0-9][a-z0-9-]{0,62}[a-z0-9](?:@[0-9]+)?\.css$" {
        limit_req zone=public_css burst=100 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/css-cache.conf;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_pass http://cssthema_api;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        # SSE (job-events) niet bufferen.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://cssthema_api;
    }

    location ~ ^/(healthz|readyz)$ {
        access_log off;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://cssthema_api;
    }

    # Metrics zijn alleen intern bereikbaar (scrape rechtstreeks op api:8000).
    location = /metrics {
        return 404;
    }

    # Elke andere .css-URL (ongeldige slug) is een 404, niet de SPA.
    location ~ \.css$ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/css;
        add_header Cache-Control "public, max-age=10" always;
        return 404 "/* cssthema: not found */\n";
    }

    # Gehashte build-assets: lang cachen.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: alle andere routes naar index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

# Interne refresh-server: de api roept na publiceren
#   GET http://nginx:8081/{slug}.css
# aan. Dat haalt de CSS altijd vers op en overschrijft de cache-entry.
# Alleen bereikbaar binnen het interne compose-netwerk (poort niet gepubliceerd).
server {
    listen 8081;
    server_name _;
    access_log off;

    location ~ "^/(?:themes/)?[a-z0-9][a-z0-9-]{0,62}[a-z0-9](?:@[0-9]+)?\.css$" {
        include /etc/nginx/snippets/css-cache.conf;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_cache_bypass 1;
        proxy_pass http://cssthema_api;
    }

    location / {
        return 404;
    }
}
