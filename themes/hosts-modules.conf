# cssthema: lichte modulestapels per host, voor Hosts > Importeren in het dashboard.
# Gemaakt uit de vastgelegde pagina's (vastleggen.py); per host pixel-vergeleken met
# algemeen.css + alg-<app>.css, meestal alleen de loginpagina. Werkt iets niet na het inloggen,
# voeg dan de ontbrekende alg-fw-* module toe (de stapel van * hieronder heeft ze bijna allemaal).
#
# Hosts zonder eigen regel volgen de koppeling * (de eerste hieronder): alg-kern, alg-fw-bootstrap,
# alg-fw-tabler, alg-fw-adminlte, alg-fw-material, alg-fw-vue en alg-fw-overig, met script
# algemeen. Niet op algemeen: de volledige algemeen.css herkent elke app met :has() en maakt zo
# elke DOM-wijziging in de app tot 200 ms trager.
#
# Nooit de NPM-regel (of een koppeling die uit staat): het dashboard, css.jbogaert.be, Authentik,
# de NPM-beheerpagina's (nginx, nginx105) en allow en aiverslag (eigen netwerk). Zie README.md.

# *
sub_filter '</head>' '<link rel="stylesheet" href="https://css.jbogaert.be/alg-kern.css"><link rel="stylesheet" href="https://css.jbogaert.be/alg-fw-bootstrap.css"><link rel="stylesheet" href="https://css.jbogaert.be/alg-fw-tabler.css"><link rel="stylesheet" href="https://css.jbogaert.be/alg-fw-adminlte.css"><link rel="stylesheet" href="https://css.jbogaert.be/alg-fw-material.css"><link rel="stylesheet" href="https://css.jbogaert.be/alg-fw-vue.css"><link rel="stylesheet" href="https://css.jbogaert.be/alg-fw-overig.css"><script src="https://css.jbogaert.be/algemeen.js" defer></script></head>';

