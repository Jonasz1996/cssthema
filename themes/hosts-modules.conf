# cssthema: lichte modulestapels per host, voor Hosts > Importeren in het dashboard.
# Gemaakt uit vastgelegd-deel1.zip; per host pixel-vergeleken met algemeen.css + alg-<app>.css
# (alleen de vastgelegde pagina's, meestal de loginpagina). Werkt iets niet na het inloggen,
# zet die host dan terug op algemeen + alg-<app> (of voeg de ontbrekende alg-fw-* module toe).
# Hosts zonder eigen regel krijgen de koppeling * (stel die in op: algemeen).

